{% extends "base.html" %}{% block content %}<div class="page-head"><div><p class="eyebrow">EMPLOYEE RECORD</p><h1>{% if object %}Edit employee{% else %}Add employee{% endif %}</h1><p>Fields marked by validation rules must contain accurate information.</p></div><a class="btn light" href="{% url 'employee-list' %}">← Back</a></div>
<section class="panel form-panel"><form method="post" class="form-grid">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{% if field.field.required %}<b>*</b>{% endif %}{{ field }}{% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}</label>{% endfor %}<div class="form-actions"><a class="btn light" href="{% url 'employee-list' %}">Cancel</a><button class="btn primary" type="submit">Save employee</button></div></form></section>{% endblock %}

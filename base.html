{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Workforce Hub{% endblock %}</title><link rel="stylesheet" href="{% static 'css/style.css' %}"><link rel="stylesheet" href="{% static 'css/auth.css' %}"></head>
<body><header class="topbar"><a class="brand" href="{% url 'employee-list' %}"><span>WH</span> Workforce Hub</a>{% if user.is_authenticated %}<nav><a href="/api/">API</a><a href="/admin/">Admin</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link-btn">Logout</button></form></nav>{% endif %}</header>
<main class="container">{% for message in messages %}<div class="toast">{{ message }}<button aria-label="Close">×</button></div>{% endfor %}{% block content %}{% endblock %}</main>
<script src="{% static 'js/app.js' %}"></script></body></html>

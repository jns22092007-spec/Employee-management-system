{% extends "base.html" %}{% block title %}Login | Workforce Hub{% endblock %}{% block content %}
<section class="auth-card"><div class="auth-icon">WH</div><h1>Welcome back</h1><p>Sign in to manage your workforce.</p>
<form method="post" class="form-grid one">{% csrf_token %}{{ form.non_field_errors }}<label>Username{{ form.username }}</label><label>Password{{ form.password }}</label><button class="btn primary" type="submit">Sign in</button></form>
<p class="auth-switch">New to Workforce Hub? <a href="{% url 'register' %}">Create an account</a></p></section>{% endblock %}
